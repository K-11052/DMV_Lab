<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceMentor AI | Splash Screen</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="splash.css">
</head>

<body>

    <!-- Background Shapes -->
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>
    <div class="bg-circle circle3"></div>

    <!-- Floating Icons -->
    <div class="floating icon1">
        <i class="fa-solid fa-file-lines"></i>
    </div>

    <div class="floating icon2">
        <i class="fa-solid fa-code"></i>
    </div>

    <div class="floating icon3">
        <i class="fa-solid fa-robot"></i>
    </div>

    <div class="floating icon4">
        <i class="fa-solid fa-graduation-cap"></i>
    </div>

    <div class="floating icon5">
        <i class="fa-solid fa-briefcase"></i>
    </div>

    <!-- Splash Container -->

    <section class="splash">

        <!-- Logo -->

        <div class="logo-box">

            <div class="logo-circle">

                <i class="fa-solid fa-robot"></i>

            </div>

            <h1>
                PlaceMentor <span>AI</span>
            </h1>

            <p class="tagline">
                Your Personal AI Placement Coach
            </p>

        </div>

        <!-- Illustration -->

        <div class="hero-image">

            <img src="images/hero.png" alt="Hero Image">

        </div>

        <!-- Features -->

        <div class="features">

            <div class="feature">

                <i class="fa-solid fa-file-arrow-up"></i>

                <span>Resume Studio</span>

            </div>

            <div class="feature">

                <i class="fa-solid fa-comments"></i>

                <span>AI Mentor</span>

            </div>

            <div class="feature">

                <i class="fa-solid fa-laptop-code"></i>

                <span>Coding Coach</span>

            </div>

            <div class="feature">

                <i class="fa-solid fa-microphone"></i>

                <span>Mock Interview</span>

            </div>

        </div>

        <!-- Loading -->

        <div class="loader">

            <div class="loading-bar">

                <div class="progress"></div>

            </div>

            <p>Preparing your AI Mentor...</p>

        </div>

    </section>

    <!-- JS -->

    <script src="splash.js"></script>

</body>
</html>
